[project]
name = "serial-mcp"
version = "0.1.0"
description = "MCP server that owns a serial port, decodes the drone/motor AA55+2float telemetry frame, and serves on-demand capture/plot/stats to Claude while optionally mirroring the live stream to serialplot."
requires-python = ">=3.10"
dependencies = [
    "pyserial>=3.5",
    "mcp[cli]>=1.2.0",
    "numpy>=1.24",
    "matplotlib>=3.7",
]

[project.scripts]
serial-mcp = "serial_mcp.server:main"

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["serial_mcp"]
