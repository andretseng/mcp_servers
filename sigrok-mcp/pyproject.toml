[project]
name = "sigrok-mcp"
version = "0.1.0"
description = "MCP server that wraps sigrok-cli to drive a sigrok-supported USB logic analyzer (fx2lafw) for Claude: scan, capture, stats, plot, CSV export, and protocol decode."
requires-python = ">=3.10"
dependencies = [
    "mcp[cli]>=1.2.0",
    "numpy>=1.24",
    "matplotlib>=3.7",
]

[project.scripts]
sigrok-mcp = "sigrok_mcp.server:main"

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["sigrok_mcp"]
